  <meta property="og:description" content="Official website of KCats Studios (kcatsstudios). Creative projects, experiments, games, and digital experiences coming soon.">

  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "KCats Studios",
    "url": "https://kcatsstudios.dev/",
    "sameAs": ["https://github.com/killercats1"]
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Avenir Next", Montserrat, system-ui, sans-serif;
      background: #141414;
      color: #f4f5f2;
      --accent: #70e1d4;
      --muted: #a4afb8;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: #141414; color: #f4f5f2; }
    .screen { position: fixed; inset: 0; overflow: auto; display: grid; place-items: center; background: #141414; }
    #login-screen { z-index: 0; background: #0e2022; }
    #home-screen { z-index: 1; background: #141414; }
    main { width: min(720px, 90vw); padding: 3rem 0; text-align: center; }
    .site-mark { position: fixed; top: 1.5rem; left: 1.5rem; z-index: 2; display: block; width: clamp(7rem, 15vw, 11rem); }
    .site-mark img { display: block; width: 100%; height: auto; }
    .badge { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; font-size: .76rem; font-weight: 600; }
    h1 { margin: .8rem 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 700; letter-spacing: -.055em; line-height: 1.08; }
    h1 span { display: inline-block; padding-bottom: .12em; border-bottom: 2px solid var(--accent); }
    p { max-width: 560px; margin: 0 auto; color: var(--muted); font-size: 1.1rem; line-height: 1.7; }
    footer { margin-top: 4rem; color: #7d8992; font-size: .9rem; }
    .github-link { position: fixed; right: 1.5rem; bottom: 1.5rem; z-index: 2; color: var(--accent); text-decoration-color: transparent; text-underline-offset: .2em; }
    .github-link:hover { text-decoration-color: currentColor; }
    .login-button, .back-button { margin-top: 1.5rem; border: 1px solid var(--accent); border-radius: 4px; padding: .7rem 1.4rem; background: transparent; color: var(--accent); font: inherit; cursor: pointer; transition: background-color .15s ease, color .15s ease; }
    .login-button:hover, .back-button:hover { background: var(--accent); color: #141414; }
    .login-button:focus-visible, .back-button:focus-visible, .site-mark:focus-visible, .github-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .login-main h1 { font-size: clamp(2.4rem, 7vw, 4rem); }
    .login-note { margin-top: 1rem; font-size: .95rem; }
    .particle-overlay { position: fixed; inset: 0; z-index: 10; width: 100vw; height: 100vh; pointer-events: auto; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 480px) {
      .site-mark { top: 1rem; left: 1rem; width: 7rem; }
      main { padding: 6rem 0 5rem; }
      h1 { font-size: clamp(2rem, 8vw, 2.5rem); }
      .github-link { right: 1rem; bottom: 1rem; }
    }
  </style>
</head>
<body>
  <section class="screen" id="login-screen" aria-hidden="true" hidden>
    <a class="site-mark" href="/" aria-label="KCats Studios home"><img src="/assets/kcats-studios-logo.png" alt="KCats Studios cat-and-S logo" width="628" height="335" decoding="async"></a>
    <main class="login-main" aria-labelledby="login-title">
      <div class="badge">Member access</div>
      <h1 id="login-title" tabindex="-1"><span>Login</span></h1>
      <p>Sign-in is not connected yet. Check back soon.</p>
      <button class="back-button" type="button" data-show-home>Back to studio</button>
      <p class="login-note" aria-live="polite" id="login-note"></p>
    </main>
    <a class="github-link" href="https://github.com/killercats1">GitHub</a>
  </section>

  <section class="screen" id="home-screen" aria-hidden="false">
    <a class="site-mark" href="/" aria-label="KCats Studios home"><img src="/assets/kcats-studios-logo.png" alt="KCats Studios cat-and-S logo" width="628" height="335" decoding="async"></a>
    <main aria-labelledby="home-title">
      <div class="badge">Indie experiments &amp; tiny games</div>
      <h1 id="home-title"><span>KCats Studios</span></h1>
      <p>KCats Studios creates creative projects, games, experiments, and digital experiences.</p>
      <button class="login-button" type="button" data-open-login>Login</button>
      <footer>Built with curiosity by KCats Studios.</footer>
    </main>
    <a class="github-link" href="https://github.com/killercats1">GitHub</a>
  </section>
  <div class="visually-hidden" id="transition-status" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const home = document.getElementById('home-screen');
      const login = document.getElementById('login-screen');
      const status = document.getElementById('transition-status');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let transitionRunning = false;

      function activateScreen(next, current) {
        current.hidden = true;
        current.setAttribute('aria-hidden', 'true');
        next.hidden = false;
        next.setAttribute('aria-hidden', 'false');
        next.style.zIndex = '1';
        current.style.zIndex = '0';
      }

      function animateDissolve(snapshot, next, current) {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: true });
        if (!context) throw new Error('Canvas 2D context is unavailable');
        canvas.width = width;
        canvas.height = height;
        canvas.className = 'particle-overlay';
        canvas.setAttribute('aria-hidden', 'true');
        context.imageSmoothingEnabled = false;

        const sample = document.createElement('canvas');
        sample.width = width;
        sample.height = height;
        const sampleContext = sample.getContext('2d', { willReadFrequently: true });
        if (!sampleContext) throw new Error('Canvas sampling context is unavailable');
        sampleContext.drawImage(snapshot, 0, 0, width, height);
        const pixels = sampleContext.getImageData(0, 0, width, height).data;
        const cell = 8;
        const particles = [];
        const centerX = width / 2;
        const centerY = height / 2;

        for (let y = 0; y < height; y += cell) {
          for (let x = 0; x < width; x += cell) {
            const sx = Math.min(width - 1, x + Math.floor(cell / 2));
            const sy = Math.min(height - 1, y + Math.floor(cell / 2));
            const index = (sy * width + sx) * 4;
            const alpha = pixels[index + 3];
            if (alpha < 16) continue;
            const dx = x + cell / 2 - centerX;
            const dy = y + cell / 2 - centerY;
            const angleJitter = (Math.random() - .5) * .8;
            const angle = Math.atan2(dy, dx) + angleJitter;
            const speed = 35 + Math.random() * 145;
            particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed + (Math.random() - .5) * 35,
              vy: Math.sin(angle) * speed - 18 - Math.random() * 35,
              delay: Math.random() * 70,
              life: 850 + Math.random() * 140,
              color: `rgba(${pixels[index]},${pixels[index + 1]},${pixels[index + 2]},${alpha / 255})`
            });
          }
        }

        document.body.appendChild(canvas);
        activateScreen(next, current);
        const startedAt = performance.now();
        const duration = 1000;

        function frame(now) {
          const elapsed = now - startedAt;
          context.clearRect(0, 0, width, height);
          for (const particle of particles) {
            const age = Math.max(0, elapsed - particle.delay);
            if (age >= particle.life) continue;
            const progress = age / particle.life;
            const seconds = age / 1000;
            const x = particle.x + particle.vx * seconds;
            const y = particle.y + particle.vy * seconds + 28 * seconds * seconds;
            context.globalAlpha = 1 - progress;
            context.fillStyle = particle.color;
            context.fillRect(x, y, cell * (1 - progress * .2), cell * (1 - progress * .2));
          }
          context.globalAlpha = 1;
          if (elapsed < duration) {
            requestAnimationFrame(frame);
          } else {
            canvas.style.pointerEvents = 'none';
            canvas.remove();
            transitionRunning = false;
            const focusTarget = next.querySelector('[data-focus]') || next.querySelector('button');
            if (focusTarget) focusTarget.focus({ preventScroll: true });
          }
        }
        requestAnimationFrame(frame);
      }

      async function switchScreen(next, current) {
        if (transitionRunning) return;
        transitionRunning = true;
        status.textContent = '';
        const triggers = document.querySelectorAll('[data-open-login], [data-show-home]');
        triggers.forEach((trigger) => { trigger.disabled = true; });

        if (reducedMotion.matches) {
          activateScreen(next, current);
          transitionRunning = false;
          triggers.forEach((trigger) => { trigger.disabled = false; });
          const focusTarget = next.querySelector('[data-focus]') || next.querySelector('button');
          if (focusTarget) focusTarget.focus({ preventScroll: true });
          return;
        }

        next.hidden = false;
        next.setAttribute('aria-hidden', 'true');
        next.style.zIndex = '0';
        current.style.zIndex = '1';

        try {
          if (typeof window.html2canvas !== 'function') {
            throw new Error('The screen capture library did not load');
          }
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          await Promise.all([...current.querySelectorAll('img')].map((image) => image.decode().catch(() => undefined)));
          const snapshot = await window.html2canvas(current, {
            backgroundColor: null,
            scale: 1,
            width: window.innerWidth,
            height: window.innerHeight,
            windowWidth: window.innerWidth,
            windowHeight: window.innerHeight,
            scrollX: 0,
            scrollY: 0,
            useCORS: true,
            logging: false
          });
          animateDissolve(snapshot, next, current);
          triggers.forEach((trigger) => { trigger.disabled = false; });
        } catch (error) {
          console.error('Unable to capture the screen for the particle dissolve:', error);
          activateScreen(next, current);
          transitionRunning = false;
          triggers.forEach((trigger) => { trigger.disabled = false; });
          status.textContent = 'The pixel dissolve could not start, so the screen changed without animation.';
          const focusTarget = next.querySelector('[data-focus]') || next.querySelector('button');
          if (focusTarget) focusTarget.focus({ preventScroll: true });
        }
      }

      document.querySelector('[data-open-login]').addEventListener('click', () => switchScreen(login, home));
      document.querySelector('[data-show-home]').addEventListener('click', () => switchScreen(home, login));
    })();
  </script>
</body>
</html>
