<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCats-Studios</title>
  <meta name="description" content="KCats-Studios — creative projects, experiments, and digital experiences.">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f7f8ff; }
    main { width: min(720px, 90vw); padding: 3rem 0; }
    .badge { color: #9da9ff; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; font-weight: 700; }
    h1 { margin: .7rem 0 1rem; font-size: clamp(2.8rem, 9vw, 6rem); line-height: .95; }
    p { max-width: 560px; color: #b7bfdc; font-size: 1.15rem; line-height: 1.7; }
    .line { width: 5rem; height: .3rem; margin: 2rem 0; border-radius: 999px; background: linear-gradient(90deg, #7c5cff, #4de1c1); }
    footer { margin-top: 4rem; color: #7780a3; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="badge">Welcome to</div>
    <h1>KCats-Studios</h1>
    <div class="line"></div>
    <p>Creative projects, experiments, and digital experiences are coming soon.</p>
    <footer>Built with curiosity by KCats-Studios.</footer>
  </main>
</body>
</html>
